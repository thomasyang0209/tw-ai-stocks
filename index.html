<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台股 AI 類股動態</title>
<style>
  :root{
    --bg:#0f1216; --panel:#181c22; --panel2:#1f242c; --line:#2a3038;
    --text:#e7ecf2; --muted:#8a94a3;
    --up:#ef4d5a; --down:#26a269; --accent:#4f9dff;
    --f-foreign:#4f9dff; --f-trust:#c07cff; --f-dealer:#f0883e; --f-price:#ffd24a;
    --chip:#222834; --grid:rgba(255,255,255,.07);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f6f9; --panel:#ffffff; --panel2:#f0f3f7; --line:#e2e6ec;
      --text:#1a1f26; --muted:#6b7583;
      --up:#d92d3a; --down:#0f8a56; --accent:#1f6fe0;
      --f-foreign:#1f6fe0; --f-trust:#8a3fd1; --f-dealer:#d9720f; --f-price:#b98600;
      --chip:#eef1f6; --grid:rgba(0,0,0,.07);
    }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1000px; margin:0 auto; padding:26px 18px 70px}
  h1{font-size:22px; margin:0; letter-spacing:.5px; cursor:pointer; display:inline-block}
  .sub{color:var(--muted); font-size:13px; margin:4px 0 20px}
  .searchbar{display:flex; gap:10px; margin-bottom:26px}
  input{flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); color:var(--text);
    font-size:16px; padding:13px 15px; border-radius:11px; outline:none;}
  input:focus{border-color:var(--accent)}
  button.go{background:var(--accent); color:#fff; border:0; font-size:15px; font-weight:600; padding:0 22px; border-radius:11px; cursor:pointer; white-space:nowrap;}

  /* 子板塊 */
  .sectors{display:grid; grid-template-columns:repeat(2,1fr); gap:14px}
  @media(max-width:720px){ .sectors{grid-template-columns:1fr} }
  .sector{background:var(--panel); border:1px solid var(--line); border-radius:15px; padding:16px 16px 14px}
  .sector h3{margin:0 0 3px; font-size:15px}
  .sector .d{color:var(--muted); font-size:12px; margin:0 0 11px; line-height:1.5}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{background:var(--chip); border:1px solid var(--line); border-radius:9px; padding:6px 10px; cursor:pointer; font-size:13px; line-height:1.2; transition:.12s}
  .chip:hover{border-color:var(--accent); color:var(--accent)}
  .chip .c{color:var(--muted); font-size:11px; margin-right:4px; font-variant-numeric:tabular-nums}
  .chip:hover .c{color:var(--accent)}

  /* 詳細頁 */
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; cursor:pointer; margin-bottom:14px; background:none; border:0; padding:0}
  .back:hover{color:var(--accent)}
  .head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px}
  .head .code{font-size:28px; font-weight:700}
  .head .name{font-size:21px}
  .head .ind{color:var(--muted); font-size:13px; background:var(--chip); padding:3px 9px; border-radius:7px}
  .head .px{margin-left:auto; text-align:right}
  .head .px .p{font-size:24px; font-weight:700; font-variant-numeric:tabular-nums}
  .head .px .dd{font-size:13px; font-variant-numeric:tabular-nums}
  .cards{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px}
  @media(max-width:640px){ .cards{grid-template-columns:repeat(2,1fr)} }
  .card{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:12px 13px}
  .card .lbl{font-size:11.5px; color:var(--muted); margin-bottom:5px}
  .card .val{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums}
  .card .cap{font-size:11px; color:var(--muted); margin-top:3px}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:18px}
  .panel-h{display:flex; align-items:center; justify-content:space-between; margin:0 2px 6px; flex-wrap:wrap; gap:8px}
  .panel-h .t{font-size:14px; font-weight:700}
  .panel-h .meta{font-size:12px; color:var(--muted)}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:8px 4px 0}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px}
  .legend .li{width:14px; height:0; border-top:2px solid var(--f-price); margin-right:5px; vertical-align:3px; display:inline-block}
  svg{width:100%; height:auto; display:block}
  .chart-txt{fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
  th,td{padding:9px 12px; text-align:right; font-size:13.5px; white-space:nowrap}
  th{color:var(--muted); font-weight:600; font-size:12px}
  th:first-child,td:first-child{text-align:left}
  tbody tr{border-top:1px solid var(--line)}
  td.date{color:var(--muted); font-size:13px}
  .pos{color:var(--up)} .neg{color:var(--down)}
  .flat{color:var(--muted)}
  .price-heatmap{display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:7px; margin:12px 0 16px}
  @media(max-width:760px){.price-heatmap{grid-template-columns:repeat(5,minmax(0,1fr))}}
  @media(max-width:420px){.price-heatmap{grid-template-columns:repeat(4,minmax(0,1fr))}}
  .heat-cell{border:1px solid var(--line); border-radius:10px; min-height:76px; padding:9px 8px; display:flex; flex-direction:column; justify-content:space-between; text-align:center}
  .heat-cell.up{background:rgba(239,77,90,.18); border-color:rgba(239,77,90,.38)}
  .heat-cell.down{background:rgba(38,162,105,.18); border-color:rgba(38,162,105,.38)}
  .heat-cell.even{background:var(--panel2)}
  .heat-date{font-size:11px; color:var(--muted)}
  .heat-close{font-size:15px; font-weight:750; margin:4px 0; font-variant-numeric:tabular-nums}
  .heat-return{font-size:12px; font-weight:700; font-variant-numeric:tabular-nums}
  .price-table td:nth-child(2),.price-table td:nth-child(3){font-weight:650}
  /* 新聞 / AI 分析 */
  .ai-sum{font-size:14px; line-height:1.75; margin:2px 2px 14px}
  .ai-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:640px){ .ai-grid{grid-template-columns:1fr} }
  .ai-box{background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:12px 14px}
  .ai-box h5{margin:0 0 8px; font-size:13px}
  .ai-box h5.drv{color:var(--up)} .ai-box h5.rsk{color:var(--f-dealer)}
  .ai-box ul{margin:0; padding-left:18px}
  .ai-box li{font-size:13px; line-height:1.65; margin-bottom:4px}
  .news-list{list-style:none; padding:0; margin:8px 0 0}
  .news-list li{border-top:1px solid var(--line); padding:9px 2px}
  .news-list a{color:var(--text); text-decoration:none; font-size:14px; line-height:1.5}
  .news-list a:hover{color:var(--accent)}
  .news-list .src{color:var(--muted); font-size:12px; margin-top:2px}
  .links a{display:inline-block; margin:4px 10px 4px 0; color:var(--accent); text-decoration:none; font-size:13px}
  /* 大盤風向 */
  .market{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:16px}
  .market .mh{font-size:13px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px}
  .market .mh .dt{color:var(--muted); font-weight:400; font-size:12px}
  .mtiles{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
  @media(max-width:640px){ .mtiles{grid-template-columns:repeat(2,1fr)} }
  .mtile{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 11px}
  .mtile .l{font-size:11.5px; color:var(--muted)}
  .mtile .v{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:3px}
  .mtile .u{font-size:11px; color:var(--muted)}
  /* 族群輪動 */
  .rotation{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:16px}
  .rotation .mh{font-size:13px; font-weight:700; display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px}
  .rotation .mh .dt{color:var(--muted); font-weight:400; font-size:12px}
  .rotation table{margin-top:5px}
  .rotation tbody tr:first-child{background:rgba(79,157,255,.08)}
  .rotation .rank{width:34px; color:var(--muted); text-align:center}
  .rotation .sector-name{text-align:left; font-weight:700}
  .rotation .sector-name small{display:block; color:var(--muted); font-weight:400; font-size:10.5px; margin-top:3px}
  .signal{display:inline-block; min-width:44px; text-align:center; padding:3px 8px; border-radius:7px; font-size:11px; font-weight:700}
  .signal.lead{background:rgba(239,77,90,.15); color:var(--up)}
  .signal.turn{background:rgba(79,157,255,.15); color:var(--accent)}
  .signal.hold{background:rgba(192,124,255,.14); color:var(--f-trust)}
  .signal.rest{background:rgba(240,136,62,.14); color:var(--f-dealer)}
  .signal.weak{background:rgba(38,162,105,.15); color:var(--down)}
  .rotation-summary{font-size:13px; line-height:1.6; margin:8px 2px 2px}
  /* 投信雷達 */
  .radar{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:16px}
  .radar-btn{background:var(--accent); color:#fff; border:0; font-size:14px; font-weight:600; padding:10px 18px; border-radius:10px; cursor:pointer}
  .radar-cols{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:6px}
  @media(max-width:760px){ .radar-cols{grid-template-columns:1fr} }
  .rcol h5{margin:0 0 6px; font-size:12.5px}
  .rrow{display:flex; align-items:center; gap:8px; font-size:13px; padding:5px 2px; border-top:1px solid var(--line); cursor:pointer}
  .rrow:hover{color:var(--accent)}
  .rrow .rk{width:16px; color:var(--muted); font-size:11px; text-align:right}
  .rrow .rn{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rrow .rn .c{color:var(--muted); font-size:11px; margin-right:4px}
  .rrow .rv{font-variant-numeric:tabular-nums; font-weight:600}
  /* 投信動向徽章 */
  .streak{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:2px 2px 10px}
  .streak .big{font-size:30px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1}
  .streak .big small{font-size:15px; font-weight:600}
  .streak .lbl{font-size:12px; color:var(--muted); margin-bottom:3px}
  .flag{font-size:13px; padding:8px 12px; border-radius:9px; line-height:1.5}
  .flag.hot{background:var(--up-soft,rgba(239,77,90,.14)); color:var(--up)}
  .flag.warn{background:rgba(240,136,62,.14); color:var(--f-dealer)}
  .flag.cool{background:var(--down-soft,rgba(38,162,105,.14)); color:var(--down)}
  button.ghost{background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:9px; cursor:pointer; font-size:13px}
  button.ghost:hover{border-color:var(--accent); color:var(--accent)}
  .tag{font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:6px; margin-left:7px; vertical-align:middle; letter-spacing:.3px; white-space:nowrap}
  .tag.live{background:rgba(79,157,255,.16); color:var(--accent)}
  .tag.daily{background:rgba(240,136,62,.18); color:var(--f-dealer)}
  .tag-legend{font-size:12.5px; color:var(--muted); margin:-10px 2px 20px; display:flex; gap:16px; flex-wrap:wrap}
  .status{padding:44px 0; text-align:center; color:var(--muted)}
  .note{color:var(--muted); font-size:12px; line-height:1.6; margin-top:8px}
  .disc{color:var(--muted); font-size:11.5px; line-height:1.6; margin-top:26px; border-top:1px solid var(--line); padding-top:14px}
</style>
</head>

function daysAgo(n){const d=new Date(); d.setDate(d.getDate()-n); return d;}
function monthsAgo(n){const d=new Date(); d.setMonth(d.getMonth()-n); return d;}
const CACHE_TTL=30*60*1000; // 本機快取 30 分鐘，減少 FinMind 請求數、避免觸及免費上限
async function fj(dataset, code, startDate){
  const key="fm:"+dataset+"|"+(code||"")+"|"+(startDate?ymd(startDate):"");
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(key)||"null"); }catch(e){}
  if(cached && Date.now()-cached.t < CACHE_TTL) return cached.d;   // 新鮮快取直接用
  try{
    const p={dataset}; if(code) p.data_id=code; if(startDate) p.start_date=ymd(startDate);
    const r=await fetch(API+"?"+new URLSearchParams(p)); const j=await r.json();
    if(j.status!==200) throw new Error(j.msg||"查詢失敗");
    try{ localStorage.setItem(key, JSON.stringify({t:Date.now(), d:j.data})); }catch(e){}
    return j.data;
  }catch(e){
    if(cached) return cached.d;   // 限流/離線時退回舊快取，維持可用
    throw e;
  }
}
const friendlyErr=e=>/Failed to fetch|upper limit|402|NetworkError|Load failed/i.test(e&&e.message||"")
  ? "資料來源暫時無法讀取——可能已達 FinMind 每小時免費請求上限（會自動重置）。請稍候幾分鐘再重試。"
  : (e&&e.message||"未知錯誤");
/* 投信淨買賣序列與連續天數 */
function trustSeries(inst){
  const m={}; (inst||[]).forEach(r=>{ if(r.name==="Investment_Trust") m[r.date]=(m[r.date]||0)+(r.buy-r.sell)/1000; });
  return Object.keys(m).sort().map(d=>({date:d, net:m[d]}));
}
function streak(ser){
  if(!ser.length) return {dir:0,days:0};
  const last=ser[ser.length-1].net; if(last===0) return {dir:0,days:0};
  const dir=last>0?1:-1; let n=0;
  for(let i=ser.length-1;i>=0;i--){ if(Math.sign(ser[i].net)===dir && ser[i].net!==0) n++; else break; }
  return {dir,days:n};
}
const cumN=(ser,n)=>ser.slice(-n).reduce((s,x)=>s+x.net,0);
/* FinMind 新聞 API 每次 start_date 只回傳「當天」，故逐日抓最近數天再合併 */
async function fetchNews(code){
  const dates=[]; for(let i=0;i<4;i++) dates.push(daysAgo(i));
  const arrs=await Promise.all(dates.map(d=>fj("TaiwanStockNews", code, d).catch(()=>[])));
  return [].concat(...arrs.map(a=>a||[]));
}
const num=(n,d=0)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const signed=n=>(n>0?"+":"")+num(n);
const cls=n=>n>0?"pos":(n<0?"neg":"");
const mdLabel=s=>s.slice(5).replace("-","/");

/* 最近 20 個交易日：依日期排序、去除重複日期，並以相鄰交易日收盤價計算單日漲跌幅 */
function recentTradingDays(price, count=20){
  const byDate=new Map();
  (price||[]).forEach(r=>{
    const close=Number(r.close);
    if(r.date && Number.isFinite(close)) byDate.set(r.date,{...r,close});
  });
  const rows=[...byDate.values()].sort((a,b)=>a.date.localeCompare(b.date));
  return rows.map((r,i)=>({
    ...r,
    dailyReturn:i>0 && rows[i-1].close!==0 ? (r.close/rows[i-1].close-1)*100 : null
  })).slice(-count);
}
function returnText(v){
  if(v==null || !Number.isFinite(v)) return "—";
  if(Math.abs(v)<0.005) return "0.00%";
  return `${v>0?"+":""}${v.toFixed(2)}%`;
}
function priceHistory20Html(price){
  const rows=recentTradingDays(price,20);
  if(!rows.length) return '<div class="note">無股價資料</div>';
  const heat=rows.map(r=>{
    const state=r.dailyReturn>0?"up":r.dailyReturn<0?"down":"even";
    const colorClass=r.dailyReturn>0?"pos":r.dailyReturn<0?"neg":"flat";
    return `<div class="heat-cell ${state}" title="${r.date}｜收盤 ${num(r.close,2)}｜${returnText(r.dailyReturn)}">
      <span class="heat-date">${mdLabel(r.date)}</span>
      <span class="heat-close">${num(r.close,2)}</span>
      <span class="heat-return ${colorClass}">${returnText(r.dailyReturn)}</span>
    </div>`;
  }).join("");
  const table=rows.slice().reverse().map(r=>`<tr>
    <td class="date">${r.date}</td>
    <td>${num(r.close,2)}</td>
    <td class="${r.dailyReturn>0?"pos":r.dailyReturn<0?"neg":"flat"}">${returnText(r.dailyReturn)}</td>
  </tr>`).join("");
  return `<div class="price-heatmap" aria-label="最近 20 個交易日漲跌熱力圖">${heat}</div>
    <div class="legend"><span><i style="background:var(--up)"></i>上漲</span><span><i style="background:var(--down)"></i>下跌</span><span><i style="background:var(--muted)"></i>平盤</span></div>
    <div class="tablewrap" style="margin-top:12px"><table class="price-table">
      <thead><tr><th>交易日期</th><th>收盤價（元）</th><th>單日漲跌幅</th></tr></thead>
      <tbody>${table}</tbody>
    </table></div>`;
}

/* ============ 通用圖表 ============ */
// 面積折線（股價）
function areaChart(dates, vals){
  const W=920,H=260,ML=52,MR=14,MT=14,MB=28,pw=W-ML-MR,ph=H-MT-MB;
  const v=vals.filter(x=>x!=null); if(!v.length) return "<div class='note'>無資料</div>";
  let lo=Math.min(...v),hi=Math.max(...v); const pad=(hi-lo||1)*.08; lo-=pad; hi+=pad;
  const n=dates.length, X=i=>ML+pw*(n<2?.5:i/(n-1)), Y=p=>MT+ph*(hi-p)/(hi-lo);
  let s=""; const ticks=4;
  for(let t=0;t<=ticks;t++){const p=lo+(hi-lo)*t/ticks,y=Y(p);
    s+=`<line x1="${ML}" y1="${y.toFixed(1)}" x2="${W-MR}" y2="${y.toFixed(1)}" stroke="var(--grid)"/>`;
    s+=`<text class="chart-txt" x="${ML-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${p.toFixed(p<50?1:0)}</text>`;}
  const pts=dates.map((d,i)=>vals[i]!=null?`${X(i).toFixed(1)},${Y(vals[i]).toFixed(1)}`:null).filter(Boolean);
  s+=`<polygon points="${X(0).toFixed(1)},${Y(lo).toFixed(1)} ${pts.join(" ")} ${X(n-1).toFixed(1)},${Y(lo).toFixed(1)}" fill="var(--accent)" opacity=".12"/>`;
  s+=`<polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  const step=Math.ceil(n/6);
  dates.forEach((d,i)=>{ if(i%step===0||i===n-1) s+=`<text class="chart-txt" x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${mdLabel(d)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
// 長條 + 折線（雙軸）
function comboChart(labels, bars, line, opt){
  opt=opt||{}; const W=920,H=280,ML=54,MR=54,MT=16,MB=30,pw=W-ML-MR,ph=H-MT-MB;
  const n=labels.length, band=pw/Math.max(n,1);
  let blo=Math.min(0,...bars), bhi=Math.max(0,...bars); if(bhi===blo){bhi=1;blo=0;} const bp=(bhi-blo)*.1; bhi+=bp; if(blo<0)blo-=bp;
  const yB=v=>MT+ph*(bhi-v)/(bhi-blo), y0=yB(0);
  const hasL=line&&line.some(x=>x!=null);
  let llo=0,lhi=1; if(hasL){const lv=line.filter(x=>x!=null); llo=Math.min(...lv); lhi=Math.max(...lv); if(lhi===llo){lhi=llo+1;} const lp=(lhi-llo)*.12; llo-=lp; lhi+=lp;}
  const yL=p=>MT+ph*(lhi-p)/(lhi-llo), cx=i=>ML+band*(i+.5);
  let s=""; const ticks=4;
  for(let t=0;t<=ticks;t++){const v=blo+(bhi-blo)*t/ticks,y=yB(v);
    s+=`<line x1="${ML}" y1="${y.toFixed(1)}" x2="${W-MR}" y2="${y.toFixed(1)}" stroke="var(--grid)"/>`;
    s+=`<text class="chart-txt" x="${ML-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${num(v)}</text>`;}
  s+=`<line x1="${ML}" y1="${y0.toFixed(1)}" x2="${W-MR}" y2="${y0.toFixed(1)}" stroke="var(--muted)" stroke-opacity=".5"/>`;
  if(hasL) for(let t=0;t<=ticks;t++){const p=llo+(lhi-llo)*t/ticks,y=yL(p);
    s+=`<text class="chart-txt" x="${W-MR+7}" y="${(y+3.5).toFixed(1)}" text-anchor="start" fill="var(--f-price)">${opt.rightFmt?opt.rightFmt(p):p.toFixed(0)}</text>`;}
  bars.forEach((v,i)=>{const w=band*.56,x=cx(i)-w/2,yv=yB(v),y=Math.min(yv,y0),h=Math.max(1,Math.abs(yv-y0));
    const fill=opt.barColor?opt.barColor(v):(v>=0?"var(--up)":"var(--down)");
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${fill}"><title>${labels[i]}｜${opt.barTip?opt.barTip(v):num(v)}</title></rect>`;});
  if(hasL){const pp=labels.map((d,i)=>line[i]!=null?`${cx(i).toFixed(1)},${yL(line[i]).toFixed(1)}`:null).filter(Boolean);
    s+=`<polyline points="${pp.join(" ")}" fill="none" stroke="var(--f-price)" stroke-width="2"/>`;
    labels.forEach((d,i)=>{if(line[i]!=null)s+=`<circle cx="${cx(i).toFixed(1)}" cy="${yL(line[i]).toFixed(1)}" r="3" fill="var(--f-price)"><title>${d}｜${opt.lineTip?opt.lineTip(line[i]):line[i]}</title></circle>`;});}
  const step=Math.max(1,Math.ceil(n/(n<=13?1:6)));
  labels.forEach((d,i)=>{if(i%step===0||i===n-1)s+=`<text class="chart-txt" x="${cx(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${d}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

/* ============ 大盤風向 ============ */
async function loadMarket(){
  const box=$("market"); if(!box) return;
  try{
    const [tot, fut] = await Promise.all([
      fj("TaiwanStockTotalInstitutionalInvestors", null, daysAgo(8)),
      fj("TaiwanFuturesInstitutionalInvestors", "TX", daysAgo(8)).catch(()=>[]),
    ]);
    const dts=[...new Set(tot.map(r=>r.date))].sort(); const day=dts[dts.length-1];
    let f=0,t=0,d=0; tot.filter(r=>r.date===day).forEach(r=>{const net=(r.buy-r.sell)/1e8;
      if(/Foreign/.test(r.name)) f+=net; else if(r.name==="Investment_Trust") t+=net; else d+=net;});
    let futHtml=`<div class="mtile"><div class="l">台指期外資</div><div class="v">–</div><div class="u">未平倉</div></div>`;
    if(fut&&fut.length){
      const fd=[...new Set(fut.map(r=>r.date))].sort(); const fday=fd[fd.length-1];
      const fx=fut.find(r=>r.date===fday && r.institutional_investors==="外資");
      if(fx){const oi=(fx.long_open_interest_balance_volume||0)-(fx.short_open_interest_balance_volume||0);
        futHtml=`<div class="mtile"><div class="l">台指期外資</div><div class="v ${cls(oi)}">${oi>0?'淨多 ':'淨空 '}${num(Math.abs(oi))}</div><div class="u">未平倉口數</div></div>`;}
    }
    const tile=(l,v)=>`<div class="mtile"><div class="l">${l}（現貨）</div><div class="v ${cls(v)}">${signed(v.toFixed(1))}</div><div class="u">億元</div></div>`;
    box.querySelector(".dt").textContent=day;
    box.querySelector(".mtiles").innerHTML=tile("外資",f)+tile("投信",t)+tile("自營商",d)+futHtml;
  }catch(e){ box.querySelector(".mtiles").innerHTML=`<div class="note">${friendlyErr(e)} <button class="ghost" id="mkRetry" style="margin-left:8px;padding:4px 10px">重試</button></div>`;
    const rb=$("mkRetry"); if(rb) rb.onclick=loadMarket; }
}

/* ============ AI 類股投信雷達 ============ */
let RADAR_CACHE=null;
function aiUniverse(){
  const seen={}, list=[];
  SECTORS.forEach(s=>s.stocks.forEach(([c,n])=>{ if(!seen[c]){seen[c]=1; list.push([c,n]);} }));
  return list;
}
async function scanTrust(){
  if(RADAR_CACHE){ renderRadar(RADAR_CACHE); return; }
  const rkey="radar:"+ymd(new Date());
  try{ const c=JSON.parse(localStorage.getItem(rkey)||"null"); if(c&&c.length){ RADAR_CACHE=c; renderRadar(c); return; } }catch(e){}
  const body=$("radar-body"); const list=aiUniverse(); const res=[];
  for(let i=0;i<list.length;i+=6){
    const chunk=list.slice(i,i+6);
    await Promise.all(chunk.map(async ([c,nm])=>{
      try{ const inst=await fj("TaiwanStockInstitutionalInvestorsBuySell", c, daysAgo(60));
        const ser=trustSeries(inst); const st=streak(ser);
        res.push({c, nm, dir:st.dir, days:st.days, cum20:cumN(ser,20)});
      }catch(e){}
    }));
    if(body) body.innerHTML=`<div class="note">掃描中… ${Math.min(i+6,list.length)} / ${list.length}</div>`;
  }
  if(!res.length){ if(body) body.innerHTML=`<div class="note">${friendlyErr({message:"Failed to fetch"})} <button class="ghost" id="rdRetry" style="margin-left:8px;padding:4px 10px">重試</button></div>`; const rb=$("rdRetry"); if(rb) rb.onclick=scanTrust; return; }
  RADAR_CACHE=res; try{ localStorage.setItem(rkey, JSON.stringify(res)); }catch(e){}
  renderRadar(res);
}
function renderRadar(res){
  const body=$("radar-body"); if(!body) return;
  const rowsFrom=arr=>arr.map((x,i)=>`<div class="rrow" data-c="${x.c}">
    <span class="rk">${i+1}</span><span class="rn"><span class="c">${x.c}</span>${x.nm}</span>
    <span class="rv ${x.v>=0?'pos':'neg'}">${x.label}</span></div>`).join("")||'<div class="note">無</div>';
  const buyStreak=res.filter(x=>x.dir===1).sort((a,b)=>b.days-a.days).slice(0,12).map(x=>({...x,v:x.days,label:x.days+" 天"}));
  const sellStreak=res.filter(x=>x.dir===-1).sort((a,b)=>b.days-a.days).slice(0,12).map(x=>({...x,v:-x.days,label:x.days+" 天"}));
  const cumBuy=res.slice().sort((a,b)=>b.cum20-a.cum20).slice(0,12).map(x=>({...x,v:x.cum20,label:signed(x.cum20)}));
  body.innerHTML=`<div class="radar-cols">
    <div class="rcol"><h5 class="pos">🔥 投信連買天數榜</h5>${rowsFrom(buyStreak)}</div>
    <div class="rcol"><h5 style="color:var(--accent)">💰 近20日投信買超榜（張）</h5>${rowsFrom(cumBuy)}</div>
    <div class="rcol"><h5 class="neg">⚠ 投信連賣天數榜（撤退警訊）</h5>${rowsFrom(sellStreak)}</div>
  </div>
  <div class="note">掃描範圍：本站 AI 類股清單（${aiUniverse().length} 檔），非全市場。點列可看個股。</div>`;
  body.querySelectorAll(".rrow").forEach(r=>r.onclick=()=>showDetail(r.dataset.c));
}

/* ============ AI 族群輪動排行 ============ */
const ROTATION_TTL=2*60*60*1000;
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
function rotationSignal(r){
  if(r.d1>=2 && r.d5>0) return {t:"領先",c:"lead"};
  if(r.d1>0 && r.d5<=0) return {t:"轉強",c:"turn"};
  if(r.d1>=0 && r.d5>0) return {t:"偏強",c:"hold"};
  if(r.d1<0 && r.d5>0) return {t:"整理",c:"rest"};
  return {t:"轉弱",c:"weak"};
}
function stockReturns(price){
  const rows=recentTradingDays(price,40); const n=rows.length;
  const ret=lag=>n>lag && rows[n-1-lag].close ? (rows[n-1].close/rows[n-1-lag].close-1)*100 : null;
  return {date:n?rows[n-1].date:"", d1:ret(1), d5:ret(5), d20:ret(20)};
}
async function loadRotation(force=false){
  const body=$("rotation-body"), meta=$("rotation-date"); if(!body) return;
  const key="sector-rotation-v1";
  if(!force){
    try{const c=JSON.parse(localStorage.getItem(key)||"null");
      if(c && Date.now()-c.t<ROTATION_TTL){renderRotation(c.rows,c.date);return;}}
    catch(e){}
  }
  body.innerHTML='<div class="note">計算 8 個 AI 族群中…</div>';
  const unique=[...new Set(ROTATION_GROUPS.flatMap(g=>g.stocks.map(s=>s[0])))];
  const pm=new Map();
  for(let i=0;i<unique.length;i+=5){
    const part=unique.slice(i,i+5);
    await Promise.all(part.map(async c=>{try{pm.set(c,await fj("TaiwanStockPrice",c,monthsAgo(2)));}catch(e){pm.set(c,[]);}}));
    if(body) body.innerHTML=`<div class="note">計算 8 個 AI 族群中… ${Math.min(i+5,unique.length)} / ${unique.length}</div>`;
  }
  const rows=ROTATION_GROUPS.map(g=>{
    const sr=g.stocks.map(([c,n])=>({c,n,...stockReturns(pm.get(c)||[])}));
    const valid=k=>sr.map(x=>x[k]).filter(Number.isFinite);
    return {name:g.name,d1:avg(valid("d1")),d5:avg(valid("d5")),d20:avg(valid("d20")),
      count:valid("d1").length, leaders:sr.filter(x=>Number.isFinite(x.d1)).sort((a,b)=>b.d1-a.d1).slice(0,2),
      date:sr.map(x=>x.date).sort().pop()||""};
  }).filter(r=>r.count).sort((a,b)=>b.d1-a.d1);
  if(!rows.length){body.innerHTML=`<div class="note">族群資料暫時無法讀取。<button class="ghost" id="rotRetry" style="margin-left:8px;padding:4px 10px">重試</button></div>`;
    const rb=$("rotRetry"); if(rb) rb.onclick=()=>loadRotation(true); return;}
  const date=rows.map(r=>r.date).sort().pop();
  try{localStorage.setItem(key,JSON.stringify({t:Date.now(),date,rows}));}catch(e){}
  renderRotation(rows,date);
}
function renderRotation(rows,date){
  const body=$("rotation-body"), meta=$("rotation-date"); if(!body)return;
  if(meta) meta.textContent=`資料日 ${date||"—"} · 代表股等權平均`;
  const pct=v=>Number.isFinite(v)?`<span class="${cls(v)}">${v>0?"+":""}${v.toFixed(2)}%</span>`:"—";
  const table=rows.map((r,i)=>{const sig=rotationSignal(r); const leaders=r.leaders.map(x=>x.n).join("、");
    return `<tr><td class="rank">${i+1}</td><td class="sector-name">${r.name}<small>${leaders}</small></td>
      <td>${pct(r.d1)}</td><td>${pct(r.d5)}</td><td>${pct(r.d20)}</td><td><span class="signal ${sig.c}">${sig.t}</span></td></tr>`;}).join("");
  const top=rows[0], rising=rows.find(r=>rotationSignal(r).t==="轉強");
  body.innerHTML=`<div class="tablewrap"><table><thead><tr><th class="rank">#</th><th style="text-align:left">族群</th><th>今日</th><th>5日</th><th>20日</th><th>狀態</th></tr></thead><tbody>${table}</tbody></table></div>
    <div class="rotation-summary">今日領先為 <b>${top.name}</b>（${top.d1>0?"+":""}${top.d1.toFixed(2)}%）${rising?`；<b>${rising.name}</b> 出現短線轉強。`:"。"}</div>
    <div class="note">以各族群代表股收盤價等權平均計算，適合觀察相對強弱，不代表整個產業指數或投資建議。<button class="ghost" id="rotRefresh" style="margin-left:8px;padding:4px 10px">重新計算</button></div>`;
  const rb=$("rotRefresh"); if(rb) rb.onclick=()=>loadRotation(true);
}

    </div>
    <div class="radar"><div class="mh" style="margin-bottom:10px"><span>AI 類股投信雷達</span></div>
      <div id="radar-body"><button class="radar-btn" id="radar-go">🔍 掃描 AI 類股投信動向（連買天數・累積買超）</button>
      <div class="note">掃描約 ${aiUniverse().length} 檔 AI 類股的投信買賣，找出連買天數最長與近20日買超最多者。</div></div></div>
    <div class="sectors">`+SECTORS.map(sec=>`
    <div class="sector">
      <h3>${sec.name}</h3><p class="d">${sec.d}</p>
      <div class="chips">${sec.stocks.map(([c,nm])=>
        `<span class="chip" data-c="${c}"><span class="c">${c}</span>${nm}</span>`).join("")}</div>
    </div>`).join("")+`</div>`;
  view.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>showDetail(ch.dataset.c));
  const rg=$("radar-go"); if(rg) rg.onclick=scanTrust;
  if(RADAR_CACHE) renderRadar(RADAR_CACHE);
  loadMarket();
  loadRotation();
}

/* ============ 個股詳細 ============ */
async function showDetail(code){
  code=(code||"").trim(); if(!code) return;
  location.hash=code;
  view.innerHTML='<div class="status">載入中…</div>';
  try{
    const [info, price, per, rev, inst, hold, news] = await Promise.all([
      fj("TaiwanStockInfo", code),
      fj("TaiwanStockPrice", code, monthsAgo(7)),
      fj("TaiwanStockPER", code, daysAgo(20)).catch(()=>[]),
      fj("TaiwanStockMonthRevenue", code, monthsAgo(26)).catch(()=>[]),
      fj("TaiwanStockInstitutionalInvestorsBuySell", code, daysAgo(95)).catch(()=>[]),
      fj("TaiwanStockShareholding", code, daysAgo(95)).catch(()=>[]),
      fetchNews(code).catch(()=>[]),
    ]);
    if((!price||!price.length) && (!info||!info.length)){
      view.innerHTML='<div class="status">查無此代碼資料，請確認股票代碼。</div>'; return; }
    renderDetail(code, info, price, per, rev, inst, hold, news);
  }catch(e){ view.innerHTML='<div class="status">'+friendlyErr(e)+'<br><button class="ghost" id="dtRetry" style="margin-top:12px;padding:8px 16px">重試</button></div>';
    const rb=$("dtRetry"); if(rb) rb.onclick=()=>showDetail(code); }
}

function renderDetail(code, info, price, per, rev, inst, hold, news){
  codeEl.style.display="none";
  const nm=info?.[0]?.stock_name||"", ind=info?.[0]?.industry_category||"";
  const lp=price?.[price.length-1];

  // 估值
  const pv=per?.[per.length-1]||{};
  // 營收 YoY
  const rmap={}; (rev||[]).forEach(r=>rmap[r.revenue_year+"-"+r.revenue_month]=r.revenue);
  const rsorted=(rev||[]).slice().sort((a,b)=>a.revenue_year-b.revenue_year||a.revenue_month-b.revenue_month);
  const last=rsorted.slice(-13);
  const revLabels=last.map(r=>String(r.revenue_year).slice(2)+"/"+String(r.revenue_month).padStart(2,"0"));
  const revBars=last.map(r=>r.revenue/1e8); // 億
  const revYoY=last.map(r=>{const py=rmap[(r.revenue_year-1)+"-"+r.revenue_month]; return py?(r.revenue/py-1)*100:null;});
  const latestRev=last[last.length-1], latestYoY=revYoY[revYoY.length-1];

  // 法人（近10日）
  const G={Foreign_Investor:"f",Foreign_Dealer_Self:"f",Investment_Trust:"t",Dealer_self:"d",Dealer_Hedging:"d"};
  const bd={}; (inst||[]).forEach(r=>{const g=G[r.name]; if(!g)return; (bd[r.date]||={f:0,t:0,d:0})[g]+=(r.buy-r.sell)/1000;});
  const idates=Object.keys(bd).sort().slice(-10);
  const pmap={}; (price||[]).forEach(p=>pmap[p.date]=p.close);
  const instTot=idates.map(d=>bd[d].f+bd[d].t+bd[d].d);
  const instPrice=idates.map(d=>pmap[d]??null);
  let sf=0,st=0,sd=0; idates.forEach(d=>{sf+=bd[d].f;st+=bd[d].t;sd+=bd[d].d;});

  // 投信動向
  const tser=trustSeries(inst); const tst=streak(tser); const tcum20=cumN(tser,20);
  const tlast=tser.slice(-25); const tprice=tlast.map(x=>pmap[x.date]??null);
  let sBig, sLbl, sCls, sFlag="";
  if(tst.dir===1){ sBig=`${tst.days}<small> 天</small>`; sLbl="投信連續買超"; sCls="pos";
    if(tst.days>=5) sFlag=`<div class="flag hot">🔥 投信連買 ${tst.days} 天，資金持續流入</div>`;
  }else if(tst.dir===-1){ sBig=`${tst.days}<small> 天</small>`; sLbl="投信連續賣超"; sCls="neg";
    if(tst.days>=5) sFlag=`<div class="flag warn">⚠ 投信連賣 ${tst.days} 天，注意基金可能撤退；若股價已大漲更要警覺</div>`;
  }else{ sBig="—"; sLbl="投信近日無連續買賣超"; sCls=""; }
  const trustHtml=`<div class="panel">
    <div class="panel-h"><span class="t">投信買賣超 vs 股價 ⭐<span class="tag live">即時</span></span><span class="meta">近 ${tlast.length} 個交易日</span></div>
    <div class="streak">
      <div><div class="lbl">${sLbl}</div><div class="big ${sCls}">${sBig}</div></div>
      <div><div class="lbl">近 20 日投信累積買賣超</div><div class="big ${cls(tcum20)}">${signed(Math.round(tcum20))}<small> 張</small></div></div>
    </div>
    ${sFlag}
    ${tlast.length?comboChart(tlast.map(x=>mdLabel(x.date)), tlast.map(x=>x.net), tprice,
      {barColor:v=>v>=0?"var(--f-trust)":"var(--down)", barTip:v=>signed(Math.round(v))+" 張",
       rightFmt:p=>num(p,p<50?1:0), lineTip:v=>"股價 "+num(v,2)+" 元"}):""}
    <div class="legend"><span><i style="background:var(--f-trust)"></i>投信單日淨買賣（張・左軸）</span><span><span class="li"></span>股價收盤（元・右軸）</span></div>
  </div>`;

  // 外資持股比例（免費資料僅有外資，非投信）
  const hsorted=(hold||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  let holdHtml="";
  if(hsorted.length){
    const hlast=hsorted[hsorted.length-1];
    const ratio=hlast.ForeignInvestmentSharesRatio;
    const hvals=hsorted.map(h=>h.ForeignInvestmentSharesRatio);
    const first=hvals[0], chg=ratio-first;
    holdHtml=`<div class="panel">
      <div class="panel-h"><span class="t">外資持股比例<span class="tag live">即時</span></span><span class="meta">近 3 個月 · 最新 ${ratio!=null?num(ratio,2)+"%":"–"}（${chg>=0?"+":""}${num(chg,2)} pts）</span></div>
      ${areaChart(hsorted.map(h=>h.date), hvals)}
      <div class="note">此為外資持股比例（證交所每日公告）。投信真實持股比例需付費資料，本站改以上方「投信累積買賣超」呈現增減持趨勢。</div>
    </div>`;
  }

  const pxHtml=lp?`<div class="px"><div class="p">${lp.close}</div>
    <div class="dd ${cls(lp.spread)}">${lp.spread>0?'▲':lp.spread<0?'▼':''} ${Math.abs(lp.spread??0).toFixed(2)}</div></div>`:"";
  const vcard=(l,v,cap)=>`<div class="card"><div class="lbl">${l}</div><div class="val">${v}</div><div class="cap">${cap}</div></div>`;

  // 即時新聞（每次開啟自動更新，來源 FinMind）
  const seen={}; const nlist=(news||[]).filter(n=>{if(!n.link||seen[n.link])return false; seen[n.link]=1; return true;})
    .sort((a,b)=>a.date<b.date?1:-1).slice(0,7);
  const cleanT=(t,s)=> t.endsWith(" - "+s)? t.slice(0, t.length-(s.length+3)) : t;
  const liveNewsHtml = nlist.length
    ? `<ul class="news-list">${nlist.map(n=>`<li><a href="${n.link}" target="_blank" rel="noopener">${cleanT(n.title,n.source)}</a><div class="src">${n.source} · ${n.date.slice(0,10)} ↗</div></li>`).join("")}</ul>`
    : `<p class="note">近期無即時新聞，可至 <a href="https://tw.stock.yahoo.com/quote/${code}.TW/news" target="_blank" rel="noopener" style="color:var(--accent)">Yahoo 股市</a> 查看。</p>`;
  const nw=NEWS[code];

  // 三面交叉分析（新聞面 × 籌碼面 × 基本面，依當日數據自動產生）
  const pc=(price||[]).map(p=>p.close);
  const pxChg = pc.length>21 ? (pc[pc.length-1]/pc[pc.length-22]-1)*100 : null;
  const hchg = hsorted.length>1 ? (hsorted[hsorted.length-1].ForeignInvestmentSharesRatio - hsorted[0].ForeignInvestmentSharesRatio) : null;
  const dir=s=>s>0?{t:"偏多",c:"pos"}:s<0?{t:"偏空",c:"neg"}:{t:"中性",c:""};

  // 籌碼面
  let chipScore=0; const chipPts=[];
  if(tst.dir===1&&tst.days>=3){chipScore++; chipPts.push(`投信連買 ${tst.days} 天`);}
  else if(tst.dir===-1&&tst.days>=3){chipScore--; chipPts.push(`投信連賣 ${tst.days} 天`);}
  chipPts.push(`投信近 20 日 ${signed(Math.round(tcum20))} 張`);
  if(sf>0){chipScore++; chipPts.push(`外資近 10 日買超 ${signed(Math.round(sf))} 張`);}
  else if(sf<0){chipScore--; chipPts.push(`外資近 10 日賣超 ${signed(Math.round(sf))} 張`);}
  if(hchg!=null){ chipPts.push(`外資持股 ${hchg>=0?"+":""}${num(hchg,2)} pts`); if(hchg>0.3)chipScore++; else if(hchg<-0.3)chipScore--; }
  const chipD=dir(chipScore);

  // 基本面
  let fundScore=0; const fundPts=[];
  if(latestYoY!=null){ fundPts.push(`月營收 YoY ${signed(latestYoY.toFixed(1))}%`); if(latestYoY>10)fundScore++; else if(latestYoY<0)fundScore--; }
  if(pv.PER!=null) fundPts.push(`本益比 ${num(pv.PER,1)} 倍`);
  if(pv.dividend_yield!=null) fundPts.push(`殖利率 ${num(pv.dividend_yield,2)}%`);
  if(pxChg!=null) fundPts.push(`近一月股價 ${signed(pxChg.toFixed(1))}%`);
  const highVal = pv.PER!=null && pv.PER>40;
  const fundD=dir(fundScore);

  // 新聞面
  const newsPts=[]; if(nw) newsPts.push(nw.sum.split(/[；。]/)[0]); newsPts.push(`近 7 日 ${nlist.length} 則即時新聞`);

  const total=chipScore+fundScore;
  const verdict = total>=2?{t:"偏多",c:"pos"}:total<=-2?{t:"偏空",c:"neg"}:{t:"中性",c:""};
  let reason;
  if(chipScore>0 && fundScore>0) reason=`籌碼面與基本面同向偏多——${nw?"新聞面有題材加持，":""}投信／外資買盤與營收成長形成共振，屬資金面與基本面雙重支撐。`;
  else if(chipScore>0 && fundScore<=0) reason=`籌碼面偏多、但基本面${fundScore<0?"轉弱":"平淡"}${highVal?"且估值偏高":""}——目前較偏『資金與題材推動』，若基本面未跟上，追高風險較高。`;
  else if(chipScore<0 && fundScore>0) reason=`基本面尚穩（營收成長）、但籌碼面轉弱——投信／外資調節，短線恐面臨賣壓或獲利了結，宜留意量能是否止穩。`;
  else if(chipScore<0 && fundScore<0) reason=`籌碼面與基本面同步轉弱——法人調節加上營收／估值壓力，${nw?"即使題材仍在，":""}短線偏空、宜保守。`;
  else reason=`三面訊號分歧或偏中性——${nw?"新聞面有題材，":""}籌碼面與基本面方向尚不一致，建議觀望、等訊號更同向再動作。`;
  if(highVal) reason+="　另注意本益比偏高，股價已反映不少期待。";
  if(tst.dir===-1&&tst.days>=5) reason+=`　且投信已連賣 ${tst.days} 天，留意基金撤退訊號。`;

  const crossHtml=`<div class="ai-box" style="margin-bottom:14px">
    <h5>🔀 三面交叉分析（新聞面 × 籌碼面 × 基本面）<span class="tag live">即時</span><span style="font-weight:400;color:var(--muted)"> · 依當日數據自動產生</span> ｜ 綜合：<span class="${verdict.c}">${verdict.t}</span></h5>
    <ul>
      <li><b>新聞面：</b>${newsPts.join("；")}</li>
      <li><b>籌碼面（<span class="${chipD.c}">${chipD.t}</span>）：</b>${chipPts.join("、")}</li>
      <li><b>基本面（<span class="${fundD.c}">${fundD.t}</span>）：</b>${fundPts.join("、")}</li>
    </ul>
    <div style="margin-top:8px;line-height:1.75"><b>綜合原因：</b>${reason}</div></div>`;

  const verifiedHtml = nw?`
      <div class="panel-h" style="margin-top:4px"><span class="t">深度分析（AI 查證大綱）<span class="tag daily">每日</span></span><span class="meta">經網路查證 · 截至 ${AS_OF}</span></div>
      <p class="ai-sum">${nw.sum}</p>
      <div class="ai-grid">
        <div class="ai-box"><h5 class="drv">▲ 成長動能</h5><ul>${nw.drv.map(x=>`<li>${x}</li>`).join("")}</ul></div>
        <div class="ai-box"><h5 class="rsk">▼ 風險 / 觀察</h5><ul>${nw.rsk.map(x=>`<li>${x}</li>`).join("")}</ul></div>
      </div>`:`<p class="note">此檔尚未內建深度查證分析；上方「三面交叉分析」與下方「即時新聞」每次開啟皆自動更新。</p>`;

  const aiHtml=`<div class="panel">
      <div class="panel-h"><span class="t">新聞 / AI 分析</span></div>
      ${crossHtml}
      ${verifiedHtml}
      <div class="panel-h" style="margin-top:16px"><span class="t">即時新聞<span class="tag live">即時</span></span><span class="meta">每次開啟自動更新 · 來源 FinMind</span></div>
      ${liveNewsHtml}
    </div>`;

  view.innerHTML=`
    <button class="back" id="back">← 返回子板塊分類</button>
    <div class="head"><span class="code">${code}</span><span class="name">${nm}</span>
      ${ind?`<span class="ind">${ind}</span>`:""}${pxHtml}</div>

    <div class="cards">
      ${vcard("本益比 PER", pv.PER!=null?num(pv.PER,2):"–", "估值")}
      ${vcard("股價淨值比 PBR", pv.PBR!=null?num(pv.PBR,2):"–", "估值")}
      ${vcard("殖利率", pv.dividend_yield!=null?num(pv.dividend_yield,2)+"%":"–", "現金殖利率")}
      ${vcard("最新月營收 YoY", latestYoY!=null?`<span class="${cls(latestYoY)}">${signed(latestYoY.toFixed(1))}%</span>`:"–", latestRev?revLabels[revLabels.length-1]+" 月":"")}
    </div>

    ${trustHtml}

    <div class="panel">
      <div class="panel-h"><span class="t">最近 20 個交易日<span class="tag live">即時</span></span><span class="meta">日期 · 收盤價 · 單日漲跌幅</span></div>
      ${priceHistory20Html(price)}
      <div class="note">依 FinMind 每日收盤價計算；單日漲跌幅＝（當日收盤價 ÷ 前一交易日收盤價 − 1）× 100%。熱力圖由左至右、由上至下為舊到新。</div>
    </div>

    ${aiHtml}

    <div class="panel">
      <div class="panel-h"><span class="t">股價走勢<span class="tag live">即時</span></span><span class="meta">近 6 個月收盤價</span></div>
      ${areaChart((price||[]).map(p=>p.date),(price||[]).map(p=>p.close))}
    </div>

    <div class="panel">
      <div class="panel-h"><span class="t">月營收成長<span class="tag live">即時</span></span><span class="meta">近 13 個月（長條：營收億元、折線：YoY%）</span></div>
      ${last.length?comboChart(revLabels, revBars, revYoY, {barColor:()=>"var(--accent)", barTip:v=>num(v)+" 億", rightFmt:p=>p.toFixed(0)+"%", lineTip:v=>v.toFixed(1)+"%"}):'<div class="note">無營收資料</div>'}
      <div class="legend"><span><i style="background:var(--accent)"></i>月營收（億）</span><span><span class="li"></span>年增率 YoY</span></div>
    </div>

    <div class="panel">
      <div class="panel-h"><span class="t">三大法人買賣超<span class="tag live">即時</span></span><span class="meta">近 10 日（長條：合計張數、折線：收盤價）</span></div>
      ${idates.length?comboChart(idates.map(mdLabel), instTot, instPrice, {barTip:v=>signed(v)+" 張", rightFmt:p=>p.toFixed(0), lineTip:v=>v}):'<div class="note">無法人資料</div>'}
      <div class="legend"><span><i style="background:var(--up)"></i>買超</span><span><i style="background:var(--down)"></i>賣超</span><span><span class="li"></span>收盤價</span></div>
      ${idates.length?`<div class="tablewrap"><table>
        <thead><tr><th>日期</th><th>外資</th><th>投信</th><th>自營商</th><th>合計</th></tr></thead>
        <tbody>${idates.slice().reverse().map(d=>{const x=bd[d];const tot=x.f+x.t+x.d;
          return `<tr><td class="date">${d}</td><td class="${cls(x.f)}">${signed(x.f)}</td><td class="${cls(x.t)}">${signed(x.t)}</td><td class="${cls(x.d)}">${signed(x.d)}</td><td class="${cls(tot)}">${signed(tot)}</td></tr>`;}).join("")}</tbody>
        <tfoot><tr><td>近10日</td><td class="${cls(sf)}">${signed(sf)}</td><td class="${cls(st)}">${signed(st)}</td><td class="${cls(sd)}">${signed(sd)}</td><td class="${cls(sf+st+sd)}">${signed(sf+st+sd)}</td></tr></tfoot>
      </table></div>`:""}
      <div class="note">單位：張（1 張 = 1000 股）· 紅買超、綠賣超。外資含外資自營商；自營商含自行買賣與避險。</div>
    </div>

    ${holdHtml}`;

  $("back").onclick=()=>{location.hash=""; renderHome();};
}

/* ============ 啟動 ============ */
$("go").onclick=()=>showDetail(codeEl.value);
codeEl.addEventListener("keydown",e=>{if(e.key==="Enter")showDetail(codeEl.value);});
$("home").onclick=()=>{location.hash=""; renderHome();};
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1); if(h) showDetail(h); else renderHome();});
const h0=location.hash.slice(1);
if(h0) showDetail(h0); else renderHome();
</script>
</body>
</html>
